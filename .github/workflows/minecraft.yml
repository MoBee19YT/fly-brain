name: Build Fly Bee (Minecraft)

on:
  workflow_dispatch:
  push:
    paths:
      - "minecraft/**"
      - ".github/workflows/minecraft.yml"

jobs:
  build:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    defaults:
      run:
        working-directory: minecraft
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'microsoft'
      - name: Build
        run: chmod +x ./gradlew && ./gradlew build --stacktrace
      - name: Inspect Minecraft API (debug)
        if: always()
        run: |
          JAR=$(find ~/.gradle/caches -name "*.jar" | grep -i -E "minecraft-(merged|common|clientOnly)|minecraft-26" | grep -v sources | head -5)
          echo "$JAR"
          for J in $JAR; do
            unzip -l "$J" | grep -i -E "entity/EntityType|EntityTypes|animal/.*Bee\.class" | head -10
            javap -classpath "$J" net.minecraft.world.entity.EntityType 2>/dev/null | grep -i -E " BEE|static .*create|spawn" | head -10
            javap -classpath "$J" net.minecraft.world.entity.EntityTypes 2>/dev/null | grep -i " BEE" | head -5
            javap -classpath "$J" net.minecraft.world.entity.Entity 2>/dev/null | grep -i -E "invulnerab|setNoGravity|move\(" | head -10
          done
      - uses: actions/upload-artifact@v4
        with:
          name: Fly Bee mod
          path: minecraft/build/libs/
      - name: Publish as a direct download
        uses: softprops/action-gh-release@v2
        with:
          tag_name: mc-26.3
          name: Fly Bee mod for Minecraft 26.3 (Fabric)
          body: "Download flybee-0.1.0.jar and add it to a Fabric 26.3 profile in the Modrinth App, together with Fabric API."
          files: minecraft/build/libs/flybee-0.1.0.jar
          make_latest: false
