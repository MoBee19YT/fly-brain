name: Build Fly Brain mod

on:
  workflow_dispatch:
  push:
    branches:
      - "**"

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        config:
        - name: Windows
          os: windows-latest
        - name: macOS
          os: macos-latest

    name: ${{ matrix.config.name }}
    runs-on: ${{ matrix.config.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Build the mod
        uses: geode-sdk/build-geode-mod@main
        with:
          sdk: given
          combine: true
          target: ${{ matrix.config.target }}

  package:
    name: Package builds
    runs-on: ubuntu-latest
    needs: ['build']
    permissions:
      contents: write

    steps:
      - uses: geode-sdk/build-geode-mod/combine@main
        id: build

      - uses: actions/upload-artifact@v4
        with:
          name: Build Output
          path: ${{ steps.build.outputs.build-output }}

      - name: Publish as a direct download
        uses: softprops/action-gh-release@v2
        with:
          tag_name: gd-2.2081
          name: Fly Brain mod for GD 2.2081
          body: "Download tomas.fly-brain.geode below and put it in Geode's mods folder (Geode button -> folder icon). Do not unzip it."
          files: ${{ steps.build.outputs.build-output }}/*.geode
          make_latest: true
